[project]
name = "dat-parkinson-challenge"
version = "1.0.0"
description = "DaT SPECT normal/abnormal classification - team Mobarmij, DrivenData DaT Parkinson's Challenge"
readme = "README.md"
license = "MIT"
authors = [{ name = "Aissam Djahnine (team Mobarmij)" }]
requires-python = "==3.12.*"
dependencies = [
    "torch==2.12.1",
    "numpy==2.2.6",
    "pandas==3.0.3",
    "scipy==1.15.3",
    "scikit-learn==1.8.0",
    "lightgbm==4.6.0",
    "nibabel==5.4.2",
    "loguru==0.7.3",
    "matplotlib==3.11.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
